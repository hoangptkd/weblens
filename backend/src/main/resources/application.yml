spring:
  application:
    name: weblens-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Đây là ngân sách connection hữu hạn cho một Control Plane instance.
      # Khi scale ngang phải chia lại ngân sách theo max_connections/PgBouncer.
      maximum-pool-size: ${WEBLENS_HIKARI_MAX_POOL_SIZE:64}
      minimum-idle: ${WEBLENS_HIKARI_MIN_IDLE:16}
      connection-timeout: ${WEBLENS_HIKARI_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${WEBLENS_HIKARI_VALIDATION_TIMEOUT_MS:1000}
      idle-timeout: ${WEBLENS_HIKARI_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${WEBLENS_HIKARI_MAX_LIFETIME_MS:1800000}
  flyway:
    enabled: true
    postgresql:
      # Required by CREATE INDEX CONCURRENTLY migrations. Session-level advisory
      # locks still serialize Flyway runners without holding an old transaction snapshot.
      transactional-lock: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  jackson:
    time-zone: UTC

server:
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful
  tomcat:
    # NIO có thể giữ nhiều connection hơn số thread xử lý. Đây là trần cấu hình,
    # không phải tuyên bố một máy đã benchmark thành công 100.000 client.
    max-connections: ${WEBLENS_TOMCAT_MAX_CONNECTIONS:100000}
    accept-count: ${WEBLENS_TOMCAT_ACCEPT_COUNT:20000}
    connection-timeout: ${WEBLENS_TOMCAT_CONNECTION_TIMEOUT:5s}
    threads:
      max: ${WEBLENS_TOMCAT_MAX_THREADS:512}
      min-spare: ${WEBLENS_TOMCAT_MIN_SPARE_THREADS:32}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${WEBLENS_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${WEBLENS_OPENAPI_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

weblens:
  security:
    jwt:
      secret: ${WEBLENS_JWT_SECRET}
      issuer: ${WEBLENS_JWT_ISSUER:weblens-api}
      audience: ${WEBLENS_JWT_AUDIENCE:weblens-web}
      access-ttl: ${WEBLENS_ACCESS_TTL:PT15M}
      refresh-ttl: ${WEBLENS_REFRESH_TTL:P7D}
    cors:
      allowed-origins: ${WEBLENS_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    cookies:
      secure: ${WEBLENS_COOKIE_SECURE:true}
  scan:
    limits:
      max-pages: ${WEBLENS_SCAN_MAX_PAGES:100000}
      max-depth: ${WEBLENS_SCAN_MAX_DEPTH:4}
      max-response-bytes: ${WEBLENS_SCAN_MAX_RESPONSE_BYTES:10485760}
      max-duration-seconds: ${WEBLENS_SCAN_MAX_DURATION_SECONDS:86400}
      max-redirects: ${WEBLENS_SCAN_MAX_REDIRECTS:5}
      concurrency: ${WEBLENS_SCAN_CONCURRENCY:10000}
  site-clone:
    max-pages: ${WEBLENS_SITE_CLONE_MAX_PAGES:100000}
    max-input-bytes: ${WEBLENS_SITE_CLONE_MAX_INPUT_BYTES:214748364800}
    max-archive-bytes: ${WEBLENS_SITE_CLONE_MAX_ARCHIVE_BYTES:53687091200}
    # Control Plane hiện kiểm tra checksum trước khi trả download, vì vậy shard
    # được chặn ở 256 MiB để không vượt ngân sách bộ nhớ của đường proxy này.
    max-shard-bytes: ${WEBLENS_SITE_CLONE_MAX_SHARD_BYTES:268435456}
    page-concurrency: ${WEBLENS_SITE_CLONE_PAGE_CONCURRENCY:4}
    max-retries-per-page: ${WEBLENS_SITE_CLONE_MAX_RETRIES_PER_PAGE:3}
    max-duration-seconds: ${WEBLENS_SITE_CLONE_MAX_DURATION_SECONDS:604800}
    archive-retention-days: ${WEBLENS_SITE_CLONE_ARCHIVE_RETENTION_DAYS:7}
    metadata-retention-days: ${WEBLENS_SITE_CLONE_METADATA_RETENTION_DAYS:30}
  crawler:
    command-url: ${WEBLENS_CRAWLER_COMMAND_URL:http://localhost:8081/internal/v1/commands/scans}
    report-base-url: ${WEBLENS_CRAWLER_REPORT_BASE_URL:http://localhost:8081}
    service-token: ${WEBLENS_SERVICE_TOKEN}
    connect-timeout: ${WEBLENS_CRAWLER_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${WEBLENS_CRAWLER_READ_TIMEOUT:PT10S}
    outbox-lease: ${WEBLENS_CRAWLER_OUTBOX_LEASE:PT30S}
    dispatch-enabled: ${WEBLENS_CRAWLER_DISPATCH_ENABLED:true}
    dispatch-poll-interval: ${WEBLENS_CRAWLER_DISPATCH_POLL_INTERVAL:PT0.5S}
  capture:
    command-url: ${WEBLENS_CAPTURE_COMMAND_URL:http://localhost:8082/internal/v1/commands/captures}
    site-clone-command-url: ${WEBLENS_SITE_CLONE_COMMAND_URL:http://localhost:8082/internal/v1/commands/site-clones}
    report-base-url: ${WEBLENS_CAPTURE_REPORT_BASE_URL:http://localhost:8082}
    service-token: ${WEBLENS_SERVICE_TOKEN}
    connect-timeout: ${WEBLENS_CAPTURE_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${WEBLENS_CAPTURE_READ_TIMEOUT:PT10S}
    outbox-lease: ${WEBLENS_CAPTURE_OUTBOX_LEASE:PT30S}
    dispatch-enabled: ${WEBLENS_CAPTURE_DISPATCH_ENABLED:true}
    dispatch-poll-interval: ${WEBLENS_CAPTURE_DISPATCH_POLL_INTERVAL:PT0.5S}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-no-correlation}] %logger{36} - %msg%n"
  level:
    root: INFO
    org.springframework.security: INFO
