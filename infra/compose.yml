name: ${COMPOSE_PROJECT_NAME:-weblens}

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weblens}
      POSTGRES_USER: ${POSTGRES_USER:-weblens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weblens-local-only}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - weblens-postgres-data:/var/lib/postgresql/data

  crawler-postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${CRAWLER_POSTGRES_DB:-weblens_crawler}
      POSTGRES_USER: ${CRAWLER_POSTGRES_USER:-weblens_crawler}
      POSTGRES_PASSWORD: ${CRAWLER_POSTGRES_PASSWORD:-weblens-crawler-local-only}
    ports:
      - "${CRAWLER_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - weblens-crawler-postgres-data:/var/lib/postgresql/data

  capture-postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${CAPTURE_POSTGRES_DB:-weblens_capture}
      POSTGRES_USER: ${CAPTURE_POSTGRES_USER:-weblens_capture}
      POSTGRES_PASSWORD: ${CAPTURE_POSTGRES_PASSWORD:-weblens-capture-local-only}
    ports:
      - "${CAPTURE_POSTGRES_PORT:-55434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - weblens-capture-postgres-data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-weblens_crawl_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-weblens_crawler}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-weblens-clickhouse-local-only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - weblens-clickhouse-data:/var/lib/clickhouse

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-weblens_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-weblens-minio-local-only}
    ports:
      - "${MINIO_API_PORT:-19001}:9000"
      - "${MINIO_CONSOLE_PORT:-19002}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - weblens-minio-data:/data

  minio-bootstrap:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_CAPTURE_BUCKET}" &&
        case "$$(mc ilm rule ls "local/$${S3_CAPTURE_BUCKET}" 2>/dev/null)" in
        *site-clone-staging/*) : ;;
        *) mc ilm rule add --prefix 'site-clone-staging/' --expire-days 1 "local/$${S3_CAPTURE_BUCKET}" ;;
        esac
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-weblens_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-weblens-minio-local-only}
      S3_CAPTURE_BUCKET: ${S3_CAPTURE_BUCKET:-weblens-captures}
    depends_on:
      minio:
        condition: service_healthy

  capture-worker:
    build:
      context: ../capture-worker
    environment:
      CAPTURE_PORT: 8082
      CAPTURE_DATABASE_URL: postgresql://${CAPTURE_POSTGRES_USER:-weblens_capture}:${CAPTURE_POSTGRES_PASSWORD:-weblens-capture-local-only}@capture-postgres:5432/${CAPTURE_POSTGRES_DB:-weblens_capture}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_CAPTURE_DATABASE: ${CLICKHOUSE_CAPTURE_DATABASE:-weblens_capture_analytics}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USER:-weblens_crawler}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-weblens-clickhouse-local-only}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-weblens_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-weblens-minio-local-only}
      S3_CAPTURE_BUCKET: ${S3_CAPTURE_BUCKET:-weblens-captures}
      WEBLENS_SERVICE_TOKEN: ${WEBLENS_SERVICE_TOKEN}
      WEBLENS_CONTROL_CAPTURE_EVENT_URL: http://host.docker.internal:8080/internal/v1/events/captures
      WEBLENS_CONTROL_SITE_CLONE_EVENT_URL: http://host.docker.internal:8080/internal/v1/events/site-clones
      WEBLENS_CRAWLER_REPORT_BASE_URL: http://host.docker.internal:8081
      CAPTURE_CONCURRENCY: ${CAPTURE_CONCURRENCY:-2}
      CAPTURE_SITE_CLONE_CONCURRENCY: ${CAPTURE_SITE_CLONE_CONCURRENCY:-2}
      CAPTURE_RECONSTRUCTION_GC_POLL_MS: ${CAPTURE_RECONSTRUCTION_GC_POLL_MS:-30000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CAPTURE_WORKER_PORT:-8082}:8082"
    depends_on:
      capture-postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully

volumes:
  weblens-postgres-data:
    name: ${WEBLENS_POSTGRES_VOLUME:-weblens-postgres-data}
  weblens-crawler-postgres-data:
    name: ${WEBLENS_CRAWLER_POSTGRES_VOLUME:-weblens-crawler-postgres-data}
  weblens-clickhouse-data:
    name: ${WEBLENS_CLICKHOUSE_VOLUME:-weblens-clickhouse-data}
  weblens-capture-postgres-data:
    name: ${WEBLENS_CAPTURE_POSTGRES_VOLUME:-weblens-capture-postgres-data}
  weblens-minio-data:
    name: ${WEBLENS_MINIO_VOLUME:-weblens-minio-data}
