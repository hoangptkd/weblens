name: CI and production deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B verify

  crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: weblens_crawler_test
          POSTGRES_USER: weblens_test
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U weblens_test -d weblens_crawler_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_DB: weblens_crawl_analytics
          CLICKHOUSE_USER: weblens_test
          CLICKHOUSE_PASSWORD: test-only-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["9000:9000"]
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      WEBLENS_TEST_POSTGRES_URL: postgres://weblens_test:test-only-password@localhost:5432/weblens_crawler_test?sslmode=disable
      WEBLENS_TEST_CLICKHOUSE_ADDR: localhost:9000
      WEBLENS_TEST_CLICKHOUSE_USERNAME: weblens_test
      WEBLENS_TEST_CLICKHOUSE_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: crawler/go.mod
          cache-dependency-path: crawler/go.sum
      - name: Test and vet crawler
        working-directory: crawler
        run: go test ./... && go vet ./...

  capture-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: weblens_capture_test
          POSTGRES_USER: weblens_test
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U weblens_test -d weblens_capture_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CAPTURE_TEST_DATABASE_URL: postgresql://weblens_test:test-only-password@localhost:5432/weblens_capture_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: capture-worker/package-lock.json
      - name: Verify capture worker
        working-directory: capture-worker
        run: npm ci --ignore-scripts && npm test && npm run test:integration && npm run typecheck && npm run build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend
        working-directory: frontend
        run: npm ci && npm run lint && npm test && npm run build

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, crawler, capture-worker, frontend]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: crawler/go.mod
          cache-dependency-path: crawler/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: |
            capture-worker/package-lock.json
            frontend/package-lock.json
      - name: Build Windows release
        shell: pwsh
        run: |
          Push-Location backend
          .\mvnw.cmd -B -DskipTests package
          Pop-Location
          Push-Location crawler
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags='-s -w' -o weblens-crawler.exe ./cmd/weblens-crawler
          Pop-Location
          Push-Location capture-worker
          npm ci --ignore-scripts
          npm run build
          $env:PLAYWRIGHT_BROWSERS_PATH = '0'
          npx playwright install chromium
          npm prune --omit=dev --ignore-scripts
          Pop-Location
          Push-Location frontend
          npm ci
          npm run build
          Pop-Location
          .\infra\production-windows\build-release.ps1 -Commit '${{ github.sha }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weblens-${{ github.sha }}-windows-amd64
          path: artifacts/weblens-${{ github.sha }}-windows-amd64.zip
          if-no-files-found: error
          retention-days: 7
      - name: Publish deployment release for VPS pull
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'deploy-${{ github.sha }}'
          $asset = 'artifacts/weblens-${{ github.sha }}-windows-amd64.zip'
          & gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --target '${{ github.sha }}' --title "WebLens ${{ github.sha }}" --notes 'Windows-native deployment artifact; no runtime secrets.'
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish deployment release' }

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.WEBLENS_PUBLIC_URL }}
    concurrency:
      group: production
      cancel-in-progress: true
    steps:
      - name: Verify VPS activated release
        shell: pwsh
        run: |
          $expected = '${{ github.sha }}'
          for ($attempt = 1; $attempt -le 180; $attempt++) {
            try {
              $version = Invoke-RestMethod -Uri "https://jobnext.top/release.json?check=$expected" -TimeoutSec 10
              if ($version.commit -eq $expected) {
                try {
                  Invoke-WebRequest -Uri 'https://jobnext.top/api/v1/auth/me' -TimeoutSec 10 -ErrorAction Stop | Out-Null
                  $apiStatus = 200
                } catch {
                  $apiStatus = [int]$_.Exception.Response.StatusCode
                }
                if ($apiStatus -eq 401) { Write-Output "WebLens $expected is serving traffic."; exit 0 }
              }
            } catch {}
            Start-Sleep -Seconds 10
          }
          throw "VPS did not activate WebLens $expected within 30 minutes"
